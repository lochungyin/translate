name: Build Sui Translate for Windows and macOS
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
            - uses: actions/upload-artifact@v4
              with:
                  name: SuiTranslate-Windows
                  path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
                  if-no-files-found: error
    macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 11
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin
            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - run: pnpm install --frozen-lockfile
            - run: pnpm test
            - run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg -- --locked
            - uses: actions/upload-artifact@v4
              with:
                  name: SuiTranslate-macOS-arm64
                  path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                  if-no-files-found: error
